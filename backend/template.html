<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="container">
        <h1>Your report for the day from Virsitile</h1>
        {% for email in emails %}
            <div class="email-item">
                <a href="{{ email.url }}">
                    <h3>{{ email.title }}</h3>
                </a>
                <p>{{ email.content }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
