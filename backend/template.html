<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div a h3 {
            padding-top: 0.7rem;
            padding-bottom: 0.7rem;
            font-family: 'Inter', sans-serif;
            background-color: white;
            font-size: 1.5rem;
        }
        .subpart {
            font-family: 'Inter', sans-serif;
            text-align: center;
            width: 100%;
        }
        body {
            background-color: lightgray;
        }
        @media (max-width: 768px) {
            .container {
                width: 85%;
            }
        }
        @media (min-width: 768px) {
            .container {
                width: 70%;
            }
        }
        .container {
            margin: auto;
            background-color: white;
        }
        .heading {
            background-color: #a855f7;
            color: white;
            display: flex;
            align-items: center; /* Center the logo and text vertically */
        }
        h3 {
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 2rem;
        }
        .text {
            padding: 1.5rem;
        }
        .box {
            margin: 1rem;
        }
        .related {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem; /* Adds space between related links */
            justify-content: space-between; /* Distributes space evenly */
            padding: 1rem 0; /* Adds padding above and below the related links */
        }
        .related-link {
            text-align: center;
            padding: 1rem;
            flex: 1 1 calc(33.33% - 1rem); /* Makes each link take up 33.33% of the container width minus the gap */
            box-sizing: border-box; /* Ensures padding and border are included in the width */
            min-width: 200px; /* Ensures links don't get too small on smaller screens */
            margin: auto;
        }
        a p {
            text-decoration: none;
            margin: 0; /* Removes default margin for better spacing */
            color: black;
        }
        a {
            color: black;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        h4{
            padding: 1rem;
            text-align: center;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading">
            <img src="cid:embedded_image" alt="Virsitile Logo" width="100px" height="100px">
            <div class="subpart">
                <h1>Daily Virsitile Report</h1>
                <p>{{ date }}</p>
            </div>
        </div>
        <hr>
        {% for email in emails %}
            <div class="email-item">
                <a href="{{ email.url }}">
                    <h3>{{ email.title }}</h3>
                </a>
                <p>{{ email.content }}</p>
            </div>
            <h4>Related Articles:</h4>
            <div class="related">
                {% for other in email.others %}
                    <a class="related-link" href="{{ other.url }}">
                        <p>{{ other.title }}</p>
                    </a>
                {% endfor %}
            </div>
            <hr>
        {% endfor %}
    </div>
</body>
</html>
