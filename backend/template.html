<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-size: 2rem;
        }
        div a h3 {
            padding-top: 0.3rem; /* Reduced padding */
            padding-bottom: 0.3rem; /* Reduced padding */
            font-family: 'Inter', sans-serif;
            background-color: white;
            font-size: 1.5rem;
        }
        .subpart {
            font-family: 'Inter', sans-serif;
            text-align: center;
            width: 100%;
        }
        body {
            background-color: lightgray;
        }
        @media (max-width: 768px) {
            .container {
                width: 85%;
            }
            .related {
                grid-template-columns: 1fr;
            }
            .logo-container {
                display: none; /* Hide image on smaller screens */
            }
        }
        @media (min-width: 768px) {
            .container {
                width: 70%;
            }
            .logo-container {
                display: block; /* Show image on larger screens */
            }
        }
        .container {
            margin: auto;
            background-color: white;
        }
        .heading {
            background-color: #a855f7;
            color: white;
            display: flex;
            align-items: center;
        }
        h3 {
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 1rem; /* Reduced padding */
        }
        .text {
            padding: 0.8rem;
        }
        .box {
            margin: 0.7rem;
        }
        /* Fixed related section to maintain side-by-side layout */
        .related {
            display: flex;
            padding-left: 1rem;
            padding-top: 0.5rem; /* Reduced padding */
            padding-bottom: 0.5rem; /* Reduced padding */
            width: calc(100% - 2rem);
            margin: 0 auto;
        }
        .related-link {
            text-align: center;
            padding: 0.5rem 0.8rem; /* Reduced padding */
            background-color: #a855f7;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease;
            display: block;
            text-decoration: none;
            margin-right: 1rem;
        }
        .related-link:hover {
            background-color: #a855f7;
        }
        .related-link p {
            color: white;
            margin: 0;
            font-size: 1rem;
            line-height: 1.4;
        }
        a {
            color: black;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        h4.topic-tag {
            display: inline-block;
            background-color: #f3e8ff;
            color: #a855f7;
            padding: 0.4rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.9rem;
            margin: 1rem 0;
            border: 1px solid #e9d5ff;
        }
        h4 {
            text-align: center;
            color: black;
        }
        .email-item {
            padding: 0 1rem;
        }
        h4.related-heading {
            margin: 1rem 0 0.5rem; /* Reduced margin */
            font-size: 1.2rem;
            color: #1e1b4b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading">
            <div class="logo-container">
                <img src="cid:embedded_image" alt="Virsitile Logo" width="100px" height="100px">
            </div>
            <div class="subpart">
                <h1>Daily Virsitile Report</h1>
                <p>{{ date }}</p>
            </div>
        </div>
        <hr>
        {% for email in emails %}
            <div class="email-item">
                <a href="{{ email.url }}">
                    <h3>{{ email.title }}</h3>
                </a>
                <h4 class="topic-tag">{{ email.topic }}</h4>
                <p>{{ email.content }}</p>
            </div>
            <h4 class="related-heading">Related Articles:</h4>
            <div class="related">
                {% for other in email.others %}
                    <a class="related-link" href="{{ other.url }}">
                        <p>{{ other.title }}</p>
                    </a>
                {% endfor %}
            </div>
            <hr>
        {% endfor %}
    </div>
</body>
</html>
