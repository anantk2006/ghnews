<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div a h3 {
            padding-top: 2rem;
            padding-bottom: 2rem;
            font-family: 'Inter', sans-serif;
            background-color: white
        }
        .subpart{
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        body{
            background-color: lightgray;
        }
        @media (max-width: 768px) {
            .container {
                width: 85%;
            }
        }
        @media (min-width: 768px) {
            .container {
                width: 70%;
            }
        }
        .container {
            margin: auto;
            background-color: white;
        }
        .heading{
            background-color: #a855f7;
            color: white;
            display: flex;
        }
        h3 {
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 2rem;
        }
        .text {
            padding: 1.5rem;
        }
        .related {
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-gap: 10px;
            border: 1px solid black;
        }
        @media (min-width: 768px) {
            .related {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, auto);
            }
        }
        .related-link {
            background-color: #a855f7;
            border: 1px solid black;
            
            text-align: center;
            padding: 1rem;
        }
        a p {
            color: white;
            text-decoration: none;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="heading"><img src="cid:embedded_image" alt="Virsitile Logo" width="100px" height="100px">
        <div class="subpart"><h1>Daily Virsitile Report</h1><p>{{ date }}</p>
        </div></div>
        
        <hr>
        {% for email in emails %}
            <div class="email-item">
                <a href="{{ email.url }}">
                    <h3>{{ email.title }}</h3>
                </a>
                <p>{{ email.content }}</p>
            </div>
            
            <div class="related">
                <p>Related Articles:</p>
            {% for other in email.others %}
                <a class="related-link" href="{{ other.url }}">
                    <p>{{ other.title }}</p>
                </a><br>
            {% endfor %}
            </div>
            <hr>
        {% endfor %}
    </div>
</body>
</html>
