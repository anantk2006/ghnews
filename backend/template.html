<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div a {
            padding-top: 2rem;
            padding-bottom: 2rem;
            font-family: 'Inter', sans-serif;
            background-color: lightgray;
        }
        .subpart{
            font-family: 'Inter', sans-serif;
            text-align: center;
        }
        body{
            background-color: lightgray;
        }
        @media (max-width: 768px) {
            .container {
                width: 85%;
            }
        }
        @media (min-width: 768px) {
            .container {
                width: 70%;
            }
        }
        .container {
            margin: auto;
            background-color: white;
        }
        .heading{
            background-color: #a855f7;
            color: white;
            display: flex;
        }
        h3 {
            text-align: center;
            text-decoration: none;
            color: black;
            padding: 3rem;
        }
        .text {
            padding: 1.5rem;
        }
        .related {
            padding: 1rem;
            grid-column: 3;
            display: flex;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading"><img src="cid:embedded_image" alt="Virsitile Logo" style="width: 20%; height: 20%;">
        <div class="subpart"><h1>Daily Virsitile Report</h1><p>{{ date }}</p>
        </div></div>
        
        <hr>
        {% for email in emails %}
            <div class="email-item">
                <a href="{{ email.url }}">
                    <h3>{{ email.title }}</h3>
                </a>
            </div>
            
            <div class="related">
                <p>Related Articles:</p>
            {% for other in email.others %}
                <a href="{{ other.url }}">{{ other.title }}</a><br>
            {% endfor %}
            </div>
            <hr>
        {% endfor %}
    </div>
</body>
</html>
